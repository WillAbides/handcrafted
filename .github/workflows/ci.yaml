name: ci
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  cibuild:
    name: cibuild
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: WillAbides/setup-go-faster@v1
        id: setup-go
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup-go.outputs.GOCACHE }}
            ${{ steps.setup-go.outputs.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('go.*', '.github/workflows/ci.yaml', 'script/*', '.bindown.yaml', '.goreleaser.yaml') }}
          restore-keys: ${{ runner.os }}-go-
      - run: script/cibuild
      - uses: WillAbides/release-train@v3.9.0
        if: github.event_name == 'pull_request'
        with:
          v0: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: cibuild
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: WillAbides/setup-go-faster@v1
        with:
          go-version-file: go.mod
      - uses: WillAbides/release-train@v3.9.0
        id: release-train
        with:
          create-release: true
          release-refs: main
          pre-tag-hook: script/release-hook
          v0: true
      - name: add bindown template
        if: steps.release-train.outputs.created-release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-train.outputs.release-tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          script/bindown -q install gh
          CONFIG_FILE="$(pwd)/tmp/add-tmpl/bindown.yaml"
          mkdir -p "$(dirname "$CONFIG_FILE")"
          echo '{}' > "$CONFIG_FILE"
          yes '' | script/bindown dependency add-by-github-release \
            "$GITHUB_REPOSITORY@$RELEASE_TAG" \
            --configfile "$CONFIG_FILE" \
            --experimental
          bin/gh release upload "$RELEASE_TAG" "$CONFIG_FILE"
