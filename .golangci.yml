version: "2"
linters:
  enable:
    - gocritic
    - gosec
    - modernize
    - revive
    - unconvert
  settings:
    errcheck:
      check-blank: true
    gocritic:
      enabled-tags:
        - style
        - diagnostic
        - performance
    govet:
      enable-all: true
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
